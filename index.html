<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>See the Invisible Web — Advanced</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
  <div id="app">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>

    <div class="ui">
      <div class="title">See the Invisible Web</div>
      <div class="controls">
        <label>Quality
          <select id="quality">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <button id="pulseBtn">Emit Pulse</button>
        <button id="screenshot">Snapshot</button>
      </div>
      <div class="hint">Camera-based AR visualization — simulated signals only.</div>
    </div>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://unpkg.com/three@0.154.0/build/three.min.js"></script>
  <!-- Simplex noise lib (small) -->
  <script src="https://unpkg.com/simplex-noise@3.0.0/dist/simplex-noise.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
