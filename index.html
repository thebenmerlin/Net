<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See the Invisible Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Camera video feed -->
    <video id="camera" autoplay playsinline></video>

    <!-- Wave visualization canvas -->
    <canvas id="waves"></canvas>

    <!-- UI overlay -->
    <div class="ui-overlay">
        <h1 class="app-title">See the Invisible Web</h1>
        <button id="toggleMode" class="mode-toggle" aria-label="Toggle color mode">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <!-- Error message -->
    <div id="errorMsg" class="error-message hidden">
        <p>Camera access denied. Showing simulated view.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
